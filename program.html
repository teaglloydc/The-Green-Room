<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Green Room</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#f1f4ee;
  --nav-bg:#3a5241;
  --primary:#4a7a57;
  --text:#2a3828;
  --muted:#5a6e58;
  --border:#c4d4be;
  --card:#ffffff;
}

body {
  margin:0;
  font-family:Lato,sans-serif;
  background:var(--bg);
  color:var(--text);
}

nav {
  background:var(--nav-bg);
  color:white;
  padding:18px 40px;
  font-family:"Cormorant Garamond",serif;
  font-size:26px;
}

.layout { display:flex; }

.sidebar {
  width:260px;
  background:white;
  border-right:1px solid var(--border);
  min-height:100vh;
}

.sidebar div {
  padding:16px;
  cursor:pointer;
}

.sidebar .active {
  background:#d4e4cc;
}

.main {
  flex:1;
  padding:40px;
}

.module { display:none; }
.module.active { display:block; }

.card {
  background:var(--card);
  border:1px solid var(--border);
  padding:20px;
  border-radius:8px;
  margin:20px 0;
}

canvas {
  border:1px solid var(--border);
  background:white;
  border-radius:8px;
}

.btn {
  background:var(--primary);
  color:white;
  border:none;
  padding:10px 16px;
  cursor:pointer;
  margin-top:10px;
}
</style>
</head>

<body>

<nav>The Green Room</nav>

<div class="layout">

<div class="sidebar">
  <div class="active" onclick="show(1)">Module 1</div>
  <div onclick="show(2)">Module 2</div>
  <div onclick="show(3)">Module 3</div>
  <div onclick="show(4)">Module 4</div>
  <div onclick="show(5)">Module 5</div>
  <div onclick="show(6)">Module 6</div>
</div>

<div class="main">

<!-- MODULE TEMPLATE -->
<div id="m1" class="module active">
  <h2>Module 1</h2>

  <div class="card">
    <p>Resize and move circles to represent internal systems.</p>

    <canvas id="tri1" width="600" height="420"></canvas>

    <button class="btn" onclick="save(1)">Save</button>
  </div>
</div>

<div id="m2" class="module">
  <h2>Module 2</h2>
  <div class="card">
    <canvas id="tri2" width="600" height="420"></canvas>
    <button class="btn" onclick="save(2)">Save</button>
  </div>
</div>

<div id="m3" class="module">
  <h2>Module 3</h2>
  <div class="card">
    <canvas id="tri3" width="600" height="420"></canvas>
    <button class="btn" onclick="save(3)">Save</button>
  </div>
</div>

<div id="m4" class="module">
  <h2>Module 4</h2>
  <div class="card">
    <canvas id="tri4" width="600" height="420"></canvas>
    <button class="btn" onclick="save(4)">Save</button>
  </div>
</div>

<div id="m5" class="module">
  <h2>Module 5</h2>
  <div class="card">
    <canvas id="tri5" width="600" height="420"></canvas>
    <button class="btn" onclick="save(5)">Save</button>
  </div>
</div>

<div id="m6" class="module">
  <h2>Module 6</h2>
  <div class="card">
    <canvas id="tri6" width="600" height="420"></canvas>
    <button class="btn" onclick="save(6)">Save</button>
    <button class="btn" onclick="exportCSV()">Export CSV</button>
  </div>
</div>

</div>
</div>

<script>
const state = {};

function initCanvas(id){
  const c = document.getElementById(id);
  const ctx = c.getContext("2d");

  state[id] = {
    circles: [
      {x:150,y:200,r:60,color:"rgba(74,122,87,0.5)",name:"Threat"},
      {x:300,y:200,r:60,color:"rgba(120,160,120,0.5)",name:"Drive"},
      {x:450,y:200,r:60,color:"rgba(180,200,180,0.5)",name:"Soothing"}
    ],
    drag:null
  };

  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    const s = state[id];

    s.circles.forEach((c1,i)=>{
      ctx.beginPath();
      ctx.arc(c1.x,c1.y,c1.r,0,Math.PI*2);
      ctx.fillStyle=c1.color;
      ctx.fill();
      ctx.stroke();
    });
  }

  function hit(mx,my,c){
    return Math.hypot(mx-c.x,my-c.y)<c.r;
  }

  c.onmousedown=(e)=>{
    const rect=c.getBoundingClientRect();
    const mx=e.clientX-rect.left;
    const my=e.clientY-rect.top;

    const s=state[id];
    s.drag = s.circles.find(c=>hit(mx,my,c));
  };

  c.onmouseup=()=>state[id].drag=null;

  c.onmousemove=(e)=>{
    const rect=c.getBoundingClientRect();
    const mx=e.clientX-rect.left;
    const my=e.clientY-rect.top;

    const s=state[id];

    if(s.drag){
      s.drag.x=mx;
      s.drag.y=my;
      draw();
    }
  };

  c.onwheel=(e)=>{
    const rect=c.getBoundingClientRect();
    const mx=e.clientX-rect.left;
    const my=e.clientY-rect.top;

    const s=state[id];

    const target=s.circles.find(c=>hit(mx,my,c));
    if(target){
      target.r += e.deltaY*-0.1;
      target.r=Math.max(10,Math.min(180,target.r));
      draw();
    }
  };

  draw();
}

function save(module){
  const id="tri"+module;
  const data=state[id].circles.map(c=>({
    x:c.x,y:c.y,r:c.r,
    area:Math.PI*c.r*c.r
  }));

  localStorage.setItem(id,JSON.stringify(data));

  // Firebase hook placeholder
  console.log("Send to Firebase:",module,data);
}

function exportCSV(){
  let rows=["module,circle,x,y,r,area"];

  for(let i=1;i<=6;i++){
    const d=JSON.parse(localStorage.getItem("tri"+i)||"[]");
    d.forEach((c,idx)=>{
      rows.push(`${i},${idx},${c.x},${c.y},${c.r},${c.area}`);
    });
  }

  const blob=new Blob([rows.join("\n")],{type:"text/csv"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="three_circles_data.csv";
  a.click();
}

function show(n){
  document.querySelectorAll(".module").forEach(m=>m.classList.remove("active"));
  document.querySelectorAll(".sidebar div").forEach(s=>s.classList.remove("active"));

  document.getElementById("m"+n).classList.add("active");
  document.querySelectorAll(".sidebar div")[n-1].classList.add("active");
}

// init all canvases
for(let i=1;i<=6;i++){
  initCanvas("tri"+i);
}
</script>

</body>
</html>
