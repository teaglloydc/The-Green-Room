<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Green Room</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f1f4ee;
  --nav:#3a5241;
  --primary:#4a7a57;
  --border:#c4d4be;
  --text:#2a3828;
}

body{
  margin:0;
  font-family:Lato,sans-serif;
  background:var(--bg);
  color:var(--text);
}

nav{
  background:var(--nav);
  color:white;
  padding:16px 32px;
  font-size:22px;
  font-family:"Cormorant Garamond",serif;
}

.layout{display:flex;}

.sidebar{
  width:240px;
  background:white;
  border-right:1px solid var(--border);
  min-height:100vh;
}

.sidebar div{
  padding:14px;
  cursor:pointer;
}

.sidebar .active{
  background:#d4e4cc;
}

.main{
  flex:1;
  padding:30px;
}

.module{display:none;}
.module.active{display:block;}

canvas{
  border:1px solid var(--border);
  background:white;
  border-radius:10px;
  display:block;
}

.card{
  background:white;
  border:1px solid var(--border);
  padding:20px;
  border-radius:10px;
  margin-top:20px;
}

button{
  margin-top:10px;
  background:var(--primary);
  color:white;
  border:none;
  padding:10px 14px;
  cursor:pointer;
}
</style>
</head>

<body>

<nav>The Green Room</nav>

<div class="layout">

<div class="sidebar">
  <div class="active" onclick="show(1)">Module 1</div>
  <div onclick="show(2)">Module 2</div>
  <div onclick="show(3)">Module 3</div>
  <div onclick="show(4)">Module 4</div>
  <div onclick="show(5)">Module 5</div>
  <div onclick="show(6)">Module 6</div>
</div>

<div class="main">

<!-- MODULES -->
<div id="m1" class="module active">
  <h2>Module 1</h2>
  <div class="card">
    <canvas id="c1" width="600" height="420"></canvas>
    <button onclick="save(1)">Save</button>
  </div>
</div>

<div id="m2" class="module">
  <h2>Module 2</h2>
  <div class="card">
    <canvas id="c2" width="600" height="420"></canvas>
    <button onclick="save(2)">Save</button>
  </div>
</div>

<div id="m3" class="module">
  <h2>Module 3</h2>
  <div class="card">
    <canvas id="c3" width="600" height="420"></canvas>
    <button onclick="save(3)">Save</button>
  </div>
</div>

<div id="m4" class="module">
  <h2>Module 4</h2>
  <div class="card">
    <canvas id="c4" width="600" height="420"></canvas>
    <button onclick="save(4)">Save</button>
  </div>
</div>

<div id="m5" class="module">
  <h2>Module 5</h2>
  <div class="card">
    <canvas id="c5" width="600" height="420"></canvas>
    <button onclick="save(5)">Save</button>
  </div>
</div>

<div id="m6" class="module">
  <h2>Module 6</h2>
  <div class="card">
    <canvas id="c6" width="600" height="420"></canvas>
    <button onclick="save(6)">Save</button>
    <button onclick="exportCSV()">Export CSV</button>
  </div>
</div>

</div>
</div>

<script>

const state = {};

function init(id){
  const canvas = document.getElementById(id);
  const ctx = canvas.getContext("2d");

  state[id] = {
    circles:[
      {x:150,y:200,r:60,color:"#e74c3c",name:"Threat"},
      {x:300,y:200,r:60,color:"#3498db",name:"Drive"},
      {x:450,y:200,r:60,color:"#2ecc71",name:"Soothing"}
    ],
    drag:null
  };

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    state[id].circles.forEach(c=>{
      ctx.beginPath();
      ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
      ctx.fillStyle=c.color;
      ctx.globalAlpha=0.35;
      ctx.fill();

      ctx.globalAlpha=1;
      ctx.strokeStyle=c.color;
      ctx.lineWidth=2;
      ctx.stroke();

      ctx.fillStyle="#2a3828";
      ctx.font="14px Arial";
      ctx.fillText(c.name,c.x-25,c.y);
    });
  }

  function hit(mx,my,c){
    return Math.hypot(mx-c.x,my-c.y)<c.r;
  }

  canvas.onmousedown=(e)=>{
    const r=canvas.getBoundingClientRect();
    const mx=e.clientX-r.left;
    const my=e.clientY-r.top;

    state[id].drag = state[id].circles.find(c=>hit(mx,my,c))||null;
  };

  canvas.onmouseup=()=>state[id].drag=null;

  canvas.onmousemove=(e)=>{
    const r=canvas.getBoundingClientRect();
    const mx=e.clientX-r.left;
    const my=e.clientY-r.top;

    const s=state[id];

    if(s.drag){
      s.drag.x=mx;
      s.drag.y=my;
      draw();
    }
  };

  canvas.onwheel=(e)=>{
    const r=canvas.getBoundingClientRect();
    const mx=e.clientX-r.left;
    const my=e.clientY-r.top;

    const s=state[id];
    const target=s.circles.find(c=>hit(mx,my,c));

    if(target){
      target.r += e.deltaY*-0.2;
      target.r=Math.max(20,Math.min(200,target.r));
      draw();
    }
  };

  draw();
}

function save(n){
  const id="c"+n;
  localStorage.setItem(id,JSON.stringify(state[id].circles));
  console.log("saved module",n,state[id].circles);
}

function exportCSV(){
  let rows=["module,circle,x,y,r"];

  for(let i=1;i<=6;i++){
    let data=JSON.parse(localStorage.getItem("c"+i)||"[]");
    data.forEach((c,j)=>{
      rows.push(`${i},${j},${c.x},${c.y},${c.r}`);
    });
  }

  const blob=new Blob([rows.join("\n")],{type:"text/csv"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="three_circles.csv";
  a.click();
}

function show(n){
  document.querySelectorAll(".module").forEach(m=>m.classList.remove("active"));
  document.querySelectorAll(".sidebar div").forEach(s=>s.classList.remove("active"));

  document.getElementById("m"+n).classList.add("active");
  document.querySelectorAll(".sidebar div")[n-1].classList.add("active");
}

for(let i=1;i<=6;i++){
  init("c"+i);
}

</script>

</body>
</html>
