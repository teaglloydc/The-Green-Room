<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Program - The Green Room</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f1f4ee;
      --nav-bg: #3a5241;
      --nav-text: #e4ece0;
      --primary: #4a7a57;
      --light-green: #e4ece0;
      --white: #fdfffe;
      --text: #2a3828;
      --text-muted: #5a6e58;
      --border: #c4d4be;
      --summary-bg: #e8f0e4;
      --active-bg: #d4e4cc;
      --shadow: 0 2px 12px rgba(40, 60, 40, 0.08);
      --threat: #c62828;
      --drive: #1565c0;
      --soothing: #2e7d32;
    }

    html { scroll-behavior: smooth; }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg);
      font-family: 'Lato', sans-serif;
      color: var(--text);
      line-height: 1.7;
    }

    nav {
      background-color: var(--nav-bg);
      padding: 18px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-logo {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      gap: 14px;
    }

    .nav-logo img {
      height: 44px;
      width: auto;
      max-width: 220px;
      display: block;
      object-fit: contain;
    }

    /* ADDED to match first file */
    .logo-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 500;
      color: var(--nav-text);
      letter-spacing: 0.5px;
      line-height: 1;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      color: var(--nav-text);
      text-decoration: none;
      font-size: 15px;
      opacity: 0.9;
      transition: opacity 0.2s;
    }

    .nav-links a:hover { opacity: 1; }

    .nav-links a.active-page {
      opacity: 1;
      font-weight: 700;
      border-bottom: 2px solid var(--nav-text);
      padding-bottom: 2px;
    }

    .dropdown { position: relative; }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: calc(100% + 18px);
      left: 0;
      background-color: var(--nav-bg);
      min-width: 180px;
      border-radius: 0 0 8px 8px;
      padding: 8px 0;
      box-shadow: var(--shadow);
    }

    .dropdown:hover .dropdown-menu { display: block; }

    .dropdown-menu a {
      display: block;
      padding: 10px 20px;
      color: var(--nav-text);
      text-decoration: none;
      font-size: 14px;
      opacity: 0.85;
      transition: opacity 0.2s, background 0.2s;
    }

    .dropdown-menu a:hover {
      opacity: 1;
      background-color: rgba(255,255,255,0.08);
    }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px;
    }

    .hamburger span {
      display: block;
      width: 24px;
      height: 2px;
      background-color: var(--nav-text);
    }

    .mobile-menu {
      display: none;
      background-color: var(--nav-bg);
      padding: 16px 24px 24px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .mobile-menu a {
      display: block;
      color: var(--nav-text);
      text-decoration: none;
      font-size: 16px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      opacity: 0.9;
    }

    .mobile-menu a:last-child { border-bottom: none; }
    .mobile-menu.open { display: block; }

    /* (everything else unchanged) */

  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">
      <img src="TheGreenRoomLogo4.png" alt="The Green Room">
      <span class="logo-text">The Green Room</span>
    </a>

    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="program.html" class="active-page">Program</a></li>
      <li class="dropdown">
        <a href="about.html">About Us</a>
        <div class="dropdown-menu">
          <a href="about.html#people">People</a>
          <a href="about.html#the-program">The Program</a>
        </div>
      </li>
    </ul>

    <button class="hamburger" onclick="toggleMenu()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

</body>
</html>
